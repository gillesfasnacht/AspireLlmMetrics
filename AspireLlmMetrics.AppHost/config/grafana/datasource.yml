apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: PBFA97CFB590B2093
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 60s
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: PCB64K9DZK68H7815
          urlDisplayLabel: "Trace: $${__value.raw}"

  - name: Loki
    type: loki
    uid: P8E80F9AEF21F6940
    url: http://loki:3100
    jsonData:
      derivedFields:
        - name: "trace_id"
          matcherType: "label"
          matcherRegex: "trace_id"
          url: "$${__value.raw}"
          datasourceUid: "PCB64K9DZK68H7815"
          urlDisplayLabel: "Trace: $${__value.raw}"

  - name: Tempo
    type: tempo
    uid: PCB64K9DZK68H7815
    url: http://tempo:3200
    jsonData:
      tracesToLogsV2:
        customQuery: true
        datasourceUid: "P8E80F9AEF21F6940"
        query: '{$${__tags}} | trace_id = "$${__trace.traceId}"'
        tags:
          - key: "service.name"
            value: "service_name"
      serviceMap:
        datasourceUid: "PBFA97CFB590B2093"
      search:
        hide: false
      nodeGraph:
        enabled: true
      lokiSearch:
        datasourceUid: "P8E80F9AEF21F6940"


